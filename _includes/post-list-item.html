{% comment %}
  Post List Item Include
  Usage: {% include post-list-item.html post=post %}
{% endcomment %}

{% assign p = include.post %}
<li class="post-list-item{% if p.canceled %} is-canceled{% endif %}">
  <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
  {% if p.canceled %}<span class="post-list-flag">Canceled</span>{% endif %}
  <time datetime="{{ p.date | date: '%Y-%m-%d' }}">{{ p.date | date: "%b %-d, %Y" }}</time>
</li>
